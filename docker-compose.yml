version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orgtraces
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_strong_password}
      POSTGRES_DB: orgtraces
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgtraces"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage for screenshots)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Create default bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/orgtraces-screenshots --ignore-existing;
      mc anonymous set download local/orgtraces-screenshots;
      "

  # Orgtraces API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PORT: 8080
      ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: orgtraces
      DB_PASSWORD: ${DB_PASSWORD:-changeme_strong_password}
      DB_NAME: orgtraces
      DB_SSL_MODE: disable
      DB_MAX_CONNS: 50
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_min_32_chars_long}
      JWT_EXPIRY: 24h
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: orgtraces-screenshots
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: auto
      AGENT_API_KEY: ${AGENT_API_KEY:-changeme_agent_api_key}
    ports:
      - "8080:8080"

  # Nginx reverse proxy (optional, for production with SSL)
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  pgdata:
  miniodata:
